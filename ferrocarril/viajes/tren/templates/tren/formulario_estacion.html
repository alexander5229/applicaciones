{% extends 'tren/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Gestión de Estacion</h2>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    <!-- Renderiza el formulario de Django de forma limpia -->
                    {{ form.as_p }}
                    
                    <div class="d-grid gap-2 mt-3">
                        <button type="submit" class="btn btn-success">Guardar Estacion</button>
                        <a href="{% url 'listar_estaciones' %}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
