{% extends 'tren/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-body text-center">
                <h2 class="card-title text-danger mb-4">Eliminar Viajero</h2>
                <p class="fs-5">¿Estás seguro de que deseas eliminar a <strong>{{ viajero.nombre }} {{ viajero.apellido }}</strong>?</p>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                        <a href="{% url 'listar_viajero' %}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
